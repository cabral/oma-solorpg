about = "The fight in the long hall, with the session lost in the middle of it: the agent's session is dropped before turn 4, so the GM must start a fresh one and pick the fight up from the campaign alone (the foes' tracks, the round, what the hero has done), without restarting it, repeating itself, or forgetting a foe. Needs no book (Ironsworn)."
adventure = "bell-under-the-hill"
character = "torvald"
max_turns = 8
fresh_session_at = [4]
setup = [
  ["commit", '{"facts": {"road.done": true, "lamps.lit": true}, "note": "the lamps are lit"}'],
  ["move", "road"],
  ["move", "mouth"],
  ["move", "hall"],
]

[player]
mode = "scripted"
lines = [
  "The hollow ones are coming. I raise my shield and stand my ground between them and the sleepers.",
  "I cut at the nearest one with my sword.",
  "I hold the line and answer its blow.",
  "I press the attack: another strike.",
  "I try to end this now.",
  "Once they are down, I check on the three people at the rope.",
]

[[expect]]
event = "act"
why = "the fight is made of moves"
by_turn = 2

[[expect]]
event = "progress"
why = "each foe is a progress track (solo track add ... --kind combat)"
by_turn = 3

[[expect]]
when = "fact.door.open"
why = "with the hollow ones dealt with, the way to the bell chamber is open (the GM commits door.open)"
by_turn = 7

[[forbid]]
text = "(Wen|Marta|Egil) (dies|is dead|falls dead|was killed)"
