# Portraits for Dragonbane heroes, drawn in text. solo/portrait.py puts them together.
#
# A head is drawn once per kin, with slots the engine fills from the hero's state:
#   L R    the left and right eye           l r    the left and right brow
#   mmmm   the mouth (always four wide)     w      a wound mark (blank while unhurt)
#   a      a line of age (blank unless old)
# Those letters are slots wherever they appear, so the drawing itself never uses them.
# Headgear comes from the profession and sits on top: its last row (the brim) replaces the
# head's first row (the crown), centred on it, and a space in it lets the head show through.
#
# The Book colours each stroke by what it is. The slots say so themselves, a shaded block
# (░▒▓) or an @ is hair, a ◆ is gold, and headgear is headgear; anything else is the line
# of the face. An `ink` block beside a head or a hat, the same shape, marks the strokes
# whose character can't say it: h hair (fur, feathers, a beard of | and /), o gold.
#
# Moods come from the hero's state: dead, dying, the newest condition held, a Dragon just
# rolled (triumph), hurt at a quarter of HP or less, or calm. Wounds show at half HP and
# get worse at a quarter. Keep to ASCII, box drawing, blocks and ● ○ • ◆ ▼: every
# monospace Nerd Font draws those one cell wide, so the layers line up.

[moods.calm]
eyes = ["●", "●"]
brows = ["─", "─"]
mouth = "╶──╴"

[moods.triumph]
eyes = ["◆", "◆"]
brows = ["─", "─"]
mouth = "╰──╯"

